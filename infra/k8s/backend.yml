apiVersion: apps/v1
kind: Deployment
metadata:
  name: parquimetro-backend
  namespace: parquimetro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: parquimetro/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres-service
            - name: MQTT_BROKER_URL
              value: ssl://mosquitto-service:8883
            - name: MQTT_CA_CERT
              value: /certs/ca.crt
            - name: MQTT_CLIENT_CERT
              value: /certs/backend.crt
            - name: MQTT_CLIENT_KEY
              value: /certs/backend.key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: parquimetro-secrets
                  key: JWT_SECRET
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: parquimetro-secrets
                  key: ADMIN_PASS
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: parquimetro-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: parquimetro-secrets
                  key: DB_PASS
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: certs
          secret:
            secretName: parquimetro-certs
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: parquimetro
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
