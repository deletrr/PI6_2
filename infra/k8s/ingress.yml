apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parquimetro-ingress
  namespace: parquimetro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: parquimetro-ratelimit@kubernetescrd
spec:
  tls:
    - hosts:
        - api.parquimetro.com
      secretName: parquimetro-tls
  rules:
    - host: api.parquimetro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: parquimetro
spec:
  rateLimit:
    average: 100
    burst: 50
