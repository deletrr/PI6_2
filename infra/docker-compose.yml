version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pontolivre_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ponto_livre
      POSTGRES_USER: pontolivre_user
      POSTGRES_PASSWORD: pontolivre_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontolivre_user -d ponto_livre"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pontolivre_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_logs:
