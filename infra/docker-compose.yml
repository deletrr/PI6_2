version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: parquimetro-db
    environment:
      POSTGRES_DB: parquimetro
      POSTGRES_USER: parquimetro
      POSTGRES_PASSWORD: parquimetro
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parquimetro"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: parquimetro-mqtt
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-p", "8883", "-t", "$$SYS/#", "-C", "1", "--cafile", "/mosquitto/certs/ca.crt", "-i", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parquimetro-backend
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: parquimetro
      DB_PASS: parquimetro
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASS: ${ADMIN_PASS}
      MQTT_BROKER_URL: ssl://mosquitto:8883
      MQTT_CA_CERT: /certs/ca.crt
      MQTT_CLIENT_CERT: /certs/backend.crt
      MQTT_CLIENT_KEY: /certs/backend.key
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro

volumes:
  pg_data:
  mosquitto_data:
  mosquitto_log:
