spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

mqtt:
  broker-url: tcp://localhost:1883
  client-id: pontolivre-test
  username: ""
  password: ""
  topics:
    - "parquimetro/+/status"

jwt:
  secret: "dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMjAyNA=="
  expiration: 3600000

parking:
  rate-per-hour: "2.00"
  free-tolerance-minutes: 15
  max-session-hours: 2
  overtime-fine: "10.00"
