spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/parquimetro
    username: ${DB_USER:parquimetro}
    password: ${DB_PASS:parquimetro}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

mqtt:
  broker-url: ${MQTT_BROKER_URL:ssl://localhost:8883}
  client-id: backend-listener
  ca-cert-path: ${MQTT_CA_CERT:/certs/ca.crt}
  client-cert-path: ${MQTT_CLIENT_CERT:/certs/client.crt}
  client-key-path: ${MQTT_CLIENT_KEY:/certs/client.key}
